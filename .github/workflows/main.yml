name: Run benchmarks

on:
  # push:
  # pull_request:
  workflow_dispatch:

jobs:
  deploy:
    name: Run benchmarks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout benchmarks
        uses: actions/checkout@v7
        with:
          path: benchmarks
          submodules: recursive

      - name: Checkout godot
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot
          path: godot

      - name: Checkout website
        uses: actions/checkout@v7
        with:
          repository: shana/godot-benchmarks-results
          path: results

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers

      - name: Set up Python 3.x
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: x64

      - name: Setup SCons
        shell: bash
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip install scons==4.10.1
          scons --version

      - name: Force remove preinstalled .NET SDKs
        run: |
          sudo rm -rf /usr/share/dotnet/sdk/*

      - name: Setup older .NET SDK as baseline
        uses: actions/setup-dotnet@v5
        with:
          # Targeting the oldest version we want to support to ensure it still builds.
          dotnet-version: 8.0.100

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: SpoiledBot App Token
        id: token
        uses: getsentry/action-github-app-token@v2
        with:
          app_id: ${{ secrets.SPOILEDBOT_ID }}
          private_key: ${{ secrets.SPOILEDBOT_KEY }}

      - name: Login Source GitHub
        run: |
          gh --version
          echo "${{ steps.token.outputs.token }}" | gh auth login --with-token
          gh auth status
          git config --global user.name "Godot Benchmarks"
          git config --global user.email "godot-benchmarks@example.com"

      - name: Run the run-benchmarks-github.sh script
        working-directory: benchmarks
        run: |
          Xvfb :0 -screen 0 1024x768x24 &
          ./run-benchmarks-github.sh
