name: Run benchmarks

on:
  push:
  # pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout benchmarks
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout godot
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot
          path: godot

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers

      - name: Set up Python 3.x
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: x64

      - name: Setup SCons
        shell: bash
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip install scons==4.10.1
          scons --version

      - name: Force remove preinstalled .NET SDKs
        run: |
          sudo rm -rf /usr/share/dotnet/sdk/*

      - name: Setup older .NET SDK as baseline
        uses: actions/setup-dotnet@v5
        with:
          # Targeting the oldest version we want to support to ensure it still builds.
          dotnet-version: 8.0.100

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Run the run-benchmarks-github.sh script
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          Xvfb :0 -screen 0 1024x768x24 &
          ./run-benchmarks-github.sh

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results.tar
          path: out/results.tar
          retention-days: 1

  results:
    name: Push results
    needs: [benchmarks]
    runs-on: ubuntu-latest
    steps:
      - name: Workaround actions/upload-artifact#176
        run: echo "ARTIFACTS_PATH=$(realpath ..)" >> $GITHUB_ENV

      - name: SpoiledBot App Token
        id: token
        uses: getsentry/action-github-app-token@v2
        with:
          app_id: ${{ secrets.SPOILEDBOT_ID }}
          private_key: ${{ secrets.SPOILEDBOT_KEY }}

      - name: Checkout website
        uses: actions/checkout@v7
        with:
          repository: shana/godot-benchmarks-results
          path: results
          fetch-depth: 0
          token: ${{ steps.token.outputs.token}}

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: results.tar
          path: ${{ env.ARTIFACTS_PATH }}

      - name: Prepare results
        run: tar -xvf ${{ env.ARTIFACTS_PATH }}/results.tar

      - name: Configure git
        run: |
          git config --global user.name "Godot Benchmarks"
          git config --global user.email "godot-benchmarks@example.com"

      - name: Login to github
        working-directory: results
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh auth setup-git
          gh auth status

      - name: Push results
        working-directory: results
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git add .
          git commit -F ../commitmsg
          git push
